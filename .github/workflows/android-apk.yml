name: Build Android Admin Tester APK
on:
  push:
    branches: [main, release/v0.1.0-admin-tester]
    paths: ['android/**','index.html','app.js','styles.css','manifest.webmanifest','sw.js','assets/**','.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: android-admin-tester-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Prepare web bundle
        run: |
          rm -rf android/www; mkdir -p android/www/assets
          cp index.html app.js styles.css manifest.webmanifest sw.js android/www/
          cp -R assets/. android/www/assets/
      - name: Install Capacitor dependencies
        working-directory: android
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Create Android native project
        working-directory: android
        run: npx cap add android
      - name: Install full native diagnostics plugin
        run: |
          P=android/android/app/src/main/java/it/cdanet/cpeconfigurator; mkdir -p "$P"
          cat > "$P/NetworkToolsPlugin.java" <<'JAVA'
          package it.cdanet.cpeconfigurator;
          import android.Manifest;import android.content.Context;import android.hardware.*;import android.net.*;import android.net.wifi.*;import android.os.Build;import com.getcapacitor.*;import com.getcapacitor.annotation.*;import com.jcraft.jsch.*;import org.json.JSONObject;import java.io.*;import java.net.*;import java.nio.charset.StandardCharsets;import java.util.*;import java.util.concurrent.*;import java.util.regex.*;
          @CapacitorPlugin(name="NetworkTools",permissions={@Permission(alias="location",strings={Manifest.permission.ACCESS_FINE_LOCATION}),@Permission(alias="camera",strings={Manifest.permission.CAMERA}),@Permission(alias="nearby",strings={"android.permission.NEARBY_WIFI_DEVICES"})})
          public class NetworkToolsPlugin extends Plugin{
            private final ExecutorService pool=Executors.newCachedThreadPool();
            private volatile JSONObject pendingProvision;
            private String slurp(InputStream in)throws Exception{ByteArrayOutputStream o=new ByteArrayOutputStream();byte[] b=new byte[8192];for(int n;(n=in.read(b))>0;)o.write(b,0,n);return o.toString(StandardCharsets.UTF_8.name());}
            private boolean safeBackend(String raw){try{URL u=new URL(raw);if("https".equalsIgnoreCase(u.getProtocol()))return true;return "http".equalsIgnoreCase(u.getProtocol())&&local(u.getHost());}catch(Exception e){return false;}}
            private String cfgValue(String v)throws Exception{if(v==null)return "";if(v.length()>4096||v.indexOf('\n')>=0||v.indexOf('\r')>=0||v.indexOf(0)>=0)throw new IOException("Valore configurazione non valido");return v;}
            private String sshExec(Session s,String command,int timeoutMs)throws Exception{ChannelExec ch=(ChannelExec)s.openChannel("exec");ch.setCommand(command);ch.setInputStream(null);ByteArrayOutputStream out=new ByteArrayOutputStream(),err=new ByteArrayOutputStream();ch.setOutputStream(out);ch.setErrStream(err);ch.connect(3000);long end=System.currentTimeMillis()+timeoutMs;while(!ch.isClosed()&&System.currentTimeMillis()<end)Thread.sleep(80);if(!ch.isClosed()){ch.disconnect();throw new IOException("Timeout comando CPE");}int status=ch.getExitStatus();ch.disconnect();if(status!=0)throw new IOException("Comando CPE fallito ("+status+")");return out.toString(StandardCharsets.UTF_8.name());}
            private boolean local(String h){try{InetAddress a=InetAddress.getByName(h);byte[] b=a.getAddress();if(a.isSiteLocalAddress()||a.isLinkLocalAddress()||a.isLoopbackAddress())return true;return b.length==4&&(b[0]&255)==100&&((b[1]&255)>=64&&(b[1]&255)<=127);}catch(Exception e){return false;}}
            @PluginMethod public void requestPermissions(PluginCall c){String[] a=Build.VERSION.SDK_INT>=33?new String[]{"location","camera","nearby"}:new String[]{"location","camera"};requestPermissionForAliases(a,c,"permissionDone");}
            @PermissionCallback private void permissionDone(PluginCall c){JSObject o=new JSObject();o.put("location",getPermissionState("location").toString());o.put("camera",getPermissionState("camera").toString());if(Build.VERSION.SDK_INT>=33)o.put("nearbyWifi",getPermissionState("nearby").toString());c.resolve(o);}
            @PluginMethod public void sensors(PluginCall c){SensorManager sm=(SensorManager)getContext().getSystemService(Context.SENSOR_SERVICE);JSArray a=new JSArray();for(Sensor s:sm.getSensorList(Sensor.TYPE_ALL)){JSObject x=new JSObject();x.put("name",s.getName());x.put("vendor",s.getVendor());x.put("type",s.getType());x.put("version",s.getVersion());x.put("maxRange",s.getMaximumRange());x.put("resolution",s.getResolution());a.put(x);}JSObject o=new JSObject();o.put("count",a.length());o.put("sensors",a);c.resolve(o);}
            @PluginMethod public void interfaces(PluginCall c){ConnectivityManager cm=(ConnectivityManager)getContext().getSystemService(Context.CONNECTIVITY_SERVICE);JSObject o=new JSObject();Network n=cm.getActiveNetwork();LinkProperties lp=n==null?null:cm.getLinkProperties(n);NetworkCapabilities nc=n==null?null:cm.getNetworkCapabilities(n);if(lp!=null){o.put("interface",lp.getInterfaceName());JSArray a=new JSArray();for(LinkAddress x:lp.getLinkAddresses())a.put(x.toString());o.put("addresses",a);JSArray dns=new JSArray();for(InetAddress x:lp.getDnsServers())dns.put(x.getHostAddress());o.put("dns",dns);JSArray routes=new JSArray();for(RouteInfo r:lp.getRoutes()){routes.put(r.toString());if(r.isDefaultRoute()&&r.getGateway()!=null)o.put("gateway",r.getGateway().getHostAddress());}o.put("routes",routes);o.put("privateDns",lp.getPrivateDnsServerName());for(LinkAddress la:lp.getLinkAddresses()){InetAddress ia=la.getAddress();if(ia instanceof Inet4Address){int p=la.getPrefixLength();byte[] bb=ia.getAddress();long v=((bb[0]&255L)<<24)|((bb[1]&255L)<<16)|((bb[2]&255L)<<8)|(bb[3]&255L);long mask=p==0?0:(0xffffffffL<<(32-p))&0xffffffffL;long net=v&mask;o.put("cidr",((net>>24)&255)+"."+((net>>16)&255)+"."+((net>>8)&255)+"."+(net&255)+"/"+p);break;}}}if(nc!=null){boolean isWifi=nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI);o.put("wifi",isWifi);o.put("cellular",nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR));o.put("validated",nc.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED));if(isWifi){try{WifiManager wm=(WifiManager)getContext().getApplicationContext().getSystemService(Context.WIFI_SERVICE);WifiInfo wi=wm.getConnectionInfo();String ss=wi==null?"":wi.getSSID();if(ss!=null&&ss.startsWith("\"")&&ss.endsWith("\""))ss=ss.substring(1,ss.length()-1);o.put("wifiSsid",ss);o.put("wifiBssid",wi==null?"":wi.getBSSID());}catch(Exception ignored){}}}c.resolve(o);}
            @PluginMethod public void wifiScan(PluginCall c){pool.execute(()->{WifiManager w=(WifiManager)getContext().getApplicationContext().getSystemService(Context.WIFI_SERVICE);try{w.startScan();try{Thread.sleep(1800);}catch(Exception ignored){}JSArray a=new JSArray();for(ScanResult r:w.getScanResults()){JSObject x=new JSObject();x.put("ssid",Build.VERSION.SDK_INT>=33?(r.getWifiSsid()==null?"":r.getWifiSsid().toString()):r.SSID);x.put("bssid",r.BSSID);x.put("rssi",r.level);x.put("frequencyMHz",r.frequency);x.put("channel",channel(r.frequency));x.put("channelWidth",r.channelWidth);x.put("capabilities",r.capabilities);a.put(x);}JSObject o=new JSObject();o.put("networks",a);c.resolve(o);}catch(SecurityException e){c.reject("Autorizza Nearby Wi-Fi/posizione");}catch(Exception e){c.reject(e.toString());}});}
            private int channel(int f){if(f==2484)return 14;if(f>=2412&&f<=2472)return(f-2407)/5;if(f>=5000&&f<=5895)return(f-5000)/5;if(f>=5955&&f<=7115)return(f-5950)/5;return 0;}
            private String runCmd(String... args)throws Exception{Process p=new ProcessBuilder(args).redirectErrorStream(true).start();ByteArrayOutputStream out=new ByteArrayOutputStream();Thread reader=new Thread(()->{try(InputStream in=p.getInputStream()){byte[] b=new byte[2048];for(int n;(n=in.read(b))>0;)out.write(b,0,n);}catch(Exception ignored){}});reader.start();if(!p.waitFor(2500,TimeUnit.MILLISECONDS)){p.destroyForcibly();throw new IOException("Timeout comando di rete");}reader.join(300);return out.toString(StandardCharsets.UTF_8.name());}
            private Map<String,String> neighborMacs(){Map<String,String> m=new HashMap<>();try(BufferedReader b=new BufferedReader(new FileReader("/proc/net/arp"))){String s;b.readLine();while((s=b.readLine())!=null){String[] p=s.trim().split("\\s+");if(p.length>=4&&p[3].matches("(?i)([0-9a-f]{2}:){5}[0-9a-f]{2}")&&!p[3].equals("00:00:00:00:00:00"))m.put(p[0],p[3].toUpperCase(Locale.ROOT));}}catch(Exception ignored){}try{String out=runCmd("/system/bin/ip","neigh","show");Matcher mm=Pattern.compile("(?m)^((?:\\d{1,3}\\.){3}\\d{1,3}).*?lladdr\\s+(([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2})").matcher(out);while(mm.find())m.put(mm.group(1),mm.group(2).toUpperCase(Locale.ROOT));}catch(Exception ignored){}return m;}
            private double pingTime(String text){Matcher m=Pattern.compile("time[=<]\\s*([0-9.]+)",Pattern.CASE_INSENSITIVE).matcher(text);if(m.find())try{return Double.parseDouble(m.group(1));}catch(Exception ignored){}return -1;}
            @PluginMethod public void ping(PluginCall c){String h=c.getString("host");if(h==null){c.reject("host required");return;}pool.execute(()->{try{long t=System.nanoTime();boolean ok=InetAddress.getByName(h).isReachable(1800);JSObject o=new JSObject();o.put("host",h);o.put("reachable",ok);o.put("ms",(System.nanoTime()-t)/1000000);c.resolve(o);}catch(Exception e){c.reject(e.toString());}});}
            @PluginMethod public void dns(PluginCall c){String h=c.getString("host");if(h==null){c.reject("host required");return;}pool.execute(()->{try{JSArray a=new JSArray();for(InetAddress x:InetAddress.getAllByName(h))a.put(x.getHostAddress());JSObject o=new JSObject();o.put("host",h);o.put("addresses",a);c.resolve(o);}catch(Exception e){c.reject(e.toString());}});}
            @PluginMethod public void trace(PluginCall c){String h=c.getString("host");if(h==null){c.reject("host required");return;}pool.execute(()->{JSArray hops=new JSArray();try{String target=InetAddress.getByName(h).getHostAddress();boolean finalReached=false;for(int ttl=1;ttl<=20;ttl++){JSObject x=new JSObject();x.put("hop",ttl);String txt="";try{txt=runCmd("/system/bin/ping","-c","1","-W","1","-t",String.valueOf(ttl),target);}catch(Exception ignored){}String hopIp=null;for(String line:txt.split("\\r?\\n")){String lower=line.toLowerCase(Locale.ROOT);if(lower.contains("from ")){Matcher mm=Pattern.compile("((?:\\d{1,3}\\.){3}\\d{1,3})").matcher(line);if(mm.find()){hopIp=mm.group(1);break;}}}if(hopIp==null&&txt.toLowerCase(Locale.ROOT).contains("bytes from"))hopIp=target;if(hopIp!=null){x.put("ip",hopIp);try{String hn=InetAddress.getByName(hopIp).getCanonicalHostName();if(hn!=null&&!hn.equals(hopIp))x.put("hostname",hn);}catch(Exception ignored){}double ms=pingTime(txt);if(ms>=0)x.put("ms",Math.round(ms*10.0)/10.0);boolean reached=hopIp.equals(target);x.put("reached",reached);hops.put(x);if(reached){finalReached=true;break;}}else{x.put("timeout",true);hops.put(x);}}JSObject o=new JSObject();o.put("target",target);o.put("hops",hops);o.put("reached",finalReached);o.put("note",finalReached?"Traceroute completato tramite ping TTL Android.":"Traceroute parziale: alcuni router possono non rispondere ai pacchetti TTL/ICMP.");c.resolve(o);}catch(Exception e){c.reject("Traceroute: "+e.getMessage());}});}
            private String speedRoot(String host,int port)throws Exception{String[] roots={"http://"+host+":"+port+"/speedtest/","https://"+host+":"+port+"/speedtest/","https://"+host+"/speedtest/","http://"+host+"/speedtest/"};Exception last=null;for(String root:roots){HttpURLConnection h=null;try{URL u=new URL(root+"latency.txt?x="+System.nanoTime());h=(HttpURLConnection)u.openConnection();h.setConnectTimeout(2500);h.setReadTimeout(2500);h.setUseCaches(false);h.setRequestProperty("Cache-Control","no-cache");int code=h.getResponseCode();if(code>=200&&code<400){try(InputStream in=h.getInputStream()){byte[] b=new byte[64];in.read(b);}return root;}}catch(Exception e){last=e;}finally{if(h!=null)h.disconnect();}}throw new IOException("Endpoint /speedtest/ non disponibile"+(last==null?"":": "+last.getMessage()));}
            private double speedDownload(String root)throws Exception{long bytes=0,start=System.nanoTime();for(int i=0;i<3;i++){HttpURLConnection h=null;try{URL u=new URL(root+"random4000x4000.jpg?x="+System.nanoTime());h=(HttpURLConnection)u.openConnection();h.setConnectTimeout(3500);h.setReadTimeout(15000);h.setUseCaches(false);h.setRequestProperty("Cache-Control","no-cache");int code=h.getResponseCode();if(code<200||code>=400)throw new IOException("HTTP "+code);try(InputStream in=h.getInputStream()){byte[] b=new byte[131072];for(int n;(n=in.read(b))>0;)bytes+=n;}}finally{if(h!=null)h.disconnect();}}double sec=(System.nanoTime()-start)/1e9;if(bytes<1000000||sec<=0)throw new IOException("download senza dati");return(bytes*8.0/sec)/1e6;}
            private double speedUpload(String root)throws Exception{byte[] payload=new byte[4*1024*1024];new java.util.Random().nextBytes(payload);long bytes=0,start=System.nanoTime();for(int i=0;i<4;i++){HttpURLConnection h=null;try{URL u=new URL(root+"upload.php?x="+System.nanoTime());h=(HttpURLConnection)u.openConnection();h.setDoOutput(true);h.setRequestMethod("POST");h.setConnectTimeout(3500);h.setReadTimeout(15000);h.setUseCaches(false);h.setRequestProperty("Content-Type","application/octet-stream");h.setFixedLengthStreamingMode(payload.length);try(OutputStream out=h.getOutputStream()){out.write(payload);out.flush();}int code=h.getResponseCode();if(code<200||code>=400)throw new IOException("HTTP "+code);try(InputStream in=h.getInputStream()){byte[] b=new byte[1024];while(in.read(b)>0){}}bytes+=payload.length;}finally{if(h!=null)h.disconnect();}}double sec=(System.nanoTime()-start)/1e9;if(bytes==0||sec<=0)throw new IOException("upload senza dati");return(bytes*8.0/sec)/1e6;}
            @PluginMethod public void speedtest(PluginCall c){String host=c.getString("host","speedtest.cda-net.it");int port=c.getInt("port",8080);pool.execute(()->{try{String root=speedRoot(host,port);long[] p=new long[5];int ok=0;for(int i=0;i<5;i++){HttpURLConnection h=null;try{long t=System.nanoTime();URL u=new URL(root+"latency.txt?x="+System.nanoTime());h=(HttpURLConnection)u.openConnection();h.setConnectTimeout(2000);h.setReadTimeout(2000);h.setUseCaches(false);int code=h.getResponseCode();if(code>=200&&code<400){try(InputStream in=h.getInputStream()){byte[] b=new byte[64];in.read(b);}p[ok++]=(System.nanoTime()-t)/1000000;}}catch(Exception ignored){}finally{if(h!=null)h.disconnect();}}if(ok==0)throw new IOException("Server Speedtest non raggiungibile via HTTP");double avg=0,jit=0;for(int i=0;i<ok;i++)avg+=p[i];avg/=ok;for(int i=1;i<ok;i++)jit+=Math.abs(p[i]-p[i-1]);if(ok>1)jit/=(ok-1);double down=0,up=0;String de=null,ue=null;try{down=speedDownload(root);}catch(Exception e){de=e.getMessage();}try{up=speedUpload(root);}catch(Exception e){ue=e.getMessage();}JSObject o=new JSObject();o.put("server",host+":"+port);o.put("endpoint",root);o.put("pingMs",Math.round(avg));o.put("jitterMs",Math.round(jit));o.put("packetLoss",Math.round((5-ok)*20.0));o.put("downloadAvailable",down>0);o.put("uploadAvailable",up>0);o.put("measurementAvailable",down>0||up>0);o.put("downloadMbps",Math.round(down*10.0)/10.0);o.put("uploadMbps",Math.round(up*10.0)/10.0);if(de!=null)o.put("downloadError",de);if(ue!=null)o.put("uploadError",ue);o.put("note",(down>0&&up>0)?"Test CDA Net completato tramite endpoint HTTP legacy /speedtest/.":"Endpoint /speedtest/ rilevato; una o più misure throughput non sono disponibili.");c.resolve(o);}catch(Exception e){c.reject("Speed Test: "+e.getMessage());}});}
            @PluginMethod public void prepareProvision(PluginCall c){String backend=c.getString("backendUrl"),token=c.getString("token");JSObject req=c.getObject("request");if(backend==null||!safeBackend(backend)){c.reject("Backend HTTPS o HTTP privato richiesto");return;}if(token==null||token.length()<20||req==null){c.reject("Sessione o richiesta provisioning mancante");return;}pool.execute(()->{HttpURLConnection h=null;try{URL u=new URL(backend.replaceAll("/+$","")+"/api/mobile/provision-package");h=(HttpURLConnection)u.openConnection();h.setRequestMethod("POST");h.setDoOutput(true);h.setConnectTimeout(5000);h.setReadTimeout(10000);h.setRequestProperty("Content-Type","application/json");h.setRequestProperty("Authorization","Bearer "+token);h.setRequestProperty("X-CDA-Client","android-native-v0.2");byte[] body=req.toString().getBytes(StandardCharsets.UTF_8);h.setFixedLengthStreamingMode(body.length);try(OutputStream out=h.getOutputStream()){out.write(body);}int code=h.getResponseCode();String text=slurp(code>=400?h.getErrorStream():h.getInputStream());if(code<200||code>=300)throw new IOException("Backend provisioning HTTP "+code+" "+(text.length()>180?text.substring(0,180):text));JSONObject p=new JSONObject(text);if(!p.optBoolean("ok",false))throw new IOException("Pacchetto provisioning non valido");pendingProvision=p;JSObject o=new JSObject();o.put("prepared",true);o.put("expiresAt",p.optString("expiresAt"));o.put("factoryIp",p.optString("factoryIp"));o.put("targetFirmware",p.optString("targetFirmware"));o.put("model",p.getJSONObject("expectedDevice").optString("model"));o.put("profileSha256",p.optString("profileSha256"));o.put("note","Pacchetto conservato solo in memoria dell'app. Ora collega il telefono alla Wi-Fi management della CPE.");c.resolve(o);}catch(Exception e){pendingProvision=null;c.reject("Preparazione provisioning: "+e.getMessage());}finally{if(h!=null)h.disconnect();}});}
            @PluginMethod public void preparedProvisionStatus(PluginCall c){JSObject o=new JSObject();JSONObject p=pendingProvision;o.put("prepared",p!=null);if(p!=null){o.put("expiresAt",p.optString("expiresAt"));o.put("factoryIp",p.optString("factoryIp"));o.put("model",p.optJSONObject("expectedDevice")==null?"":p.optJSONObject("expectedDevice").optString("model"));}c.resolve(o);}
            @PluginMethod public void clearPreparedProvision(PluginCall c){pendingProvision=null;JSObject o=new JSObject();o.put("cleared",true);c.resolve(o);}
            @PluginMethod public void probeCpe(PluginCall c){pool.execute(()->{String host="192.168.172.1";try{JSONObject p=pendingProvision;if(p!=null)host=p.optString("factoryIp",host);if(!local(host)){c.reject("Target CPE non locale");return;}JSObject o=new JSObject();o.put("host",host);o.put("reachable",InetAddress.getByName(host).isReachable(1500));JSArray ports=new JSArray();for(int port:new int[]{22,80,443,20080,20443}){try(Socket x=new Socket()){x.connect(new InetSocketAddress(host,port),700);ports.put(port);}catch(Exception ignored){}}o.put("openPorts",ports);c.resolve(o);}catch(Exception e){c.reject("Probe CPE: "+e.getMessage());}});}
            @PluginMethod public void openCpeSetup(PluginCall c){try{String host="192.168.172.1";JSONObject p=pendingProvision;if(p!=null)host=p.optString("factoryIp",host);android.content.Intent i=new android.content.Intent(android.content.Intent.ACTION_VIEW,android.net.Uri.parse("http://"+host+"/"));getActivity().startActivity(i);JSObject o=new JSObject();o.put("opened",true);o.put("host",host);c.resolve(o);}catch(Exception e){c.reject("Apertura CPE: "+e.getMessage());}}
            @PluginMethod public void provisionPrepared(PluginCall c){JSONObject p=pendingProvision;if(p==null){c.reject("Nessun provisioning preparato. Preparalo mentre sei online.");return;}pool.execute(()->{Session session=null;try{String expires=p.optString("expiresAt");if(!expires.isEmpty()&&java.time.Instant.parse(expires).isBefore(java.time.Instant.now()))throw new IOException("Pacchetto provisioning scaduto: riconnetti Internet e preparalo di nuovo");String host=p.optString("factoryIp","192.168.172.1");if(!local(host))throw new IOException("Target CPE non locale");JSONObject device=p.getJSONObject("device"),expected=p.getJSONObject("expectedDevice"),wireless=p.getJSONObject("wireless"),pppoe=p.getJSONObject("pppoe"),mgmt=p.getJSONObject("management");String user=cfgValue(device.getString("username")),pass=cfgValue(device.getString("password"));JSch jsch=new JSch();session=jsch.getSession(user,host,22);session.setPassword(pass);Properties props=new Properties();props.put("StrictHostKeyChecking","no");session.setConfig(props);session.connect(7000);String info=sshExec(session,"echo __VERSION__; (cat /etc/version 2>/dev/null || true); echo __BOARD__; (cat /etc/board.info 2>/dev/null || true); echo __SYSTEM__; (cat /proc/ubnthal/system.info 2>/dev/null || true)",5000);String targetFw=p.optString("targetFirmware","8.7.4");if(!info.contains(targetFw))throw new IOException("Firmware rilevato diverso da "+targetFw+". Eseguire prima la normalizzazione firmware.");String boardMatch=p.optString("boardMatch","");if(boardMatch.isEmpty())throw new IOException("Profilo privo di boardMatch: blocco di sicurezza");if(!Pattern.compile(boardMatch,Pattern.CASE_INSENSITIVE|Pattern.DOTALL).matcher(info).find())throw new IOException("Il profilo non corrisponde alla board rilevata");String expectedMac=expected.optString("mac","").replaceAll("[^0-9A-Fa-f]","").toLowerCase(Locale.ROOT);if(!expectedMac.isEmpty()){Matcher mm=Pattern.compile("(?im)^(?:board\\.hwaddr|eth0\\.macaddr|serialno)=([0-9A-Fa-f:.-]+)$").matcher(info);boolean macOk=false;while(mm.find()){String got=mm.group(1).replaceAll("[^0-9A-Fa-f]","").toLowerCase(Locale.ROOT);if(got.equals(expectedMac)){macOk=true;break;}}if(!macOk)throw new IOException("MAC rilevato diverso dal MAC atteso: provisioning bloccato");}String cfg=p.getString("profileTemplate");Map<String,String> vars=new LinkedHashMap<>();vars.put("${SSID}",cfgValue(wireless.getString("ssid")));vars.put("${WPA2_PSK}",cfgValue(wireless.getString("password")));vars.put("${PPPOE_USER}",cfgValue(pppoe.getString("username")));vars.put("${PPPOE_PASSWORD}",cfgValue(pppoe.getString("password")));vars.put("${HTTP_PORT}",String.valueOf(mgmt.optInt("httpPort",20080)));vars.put("${HTTPS_PORT}",String.valueOf(mgmt.optInt("httpsPort",20443)));vars.put("${UISP_ENROLLMENT}",cfgValue(p.optString("uispEnrollment","")));vars.put("${SNMP_COMMUNITY}",cfgValue(p.optString("snmpCommunity","")));vars.put("${CPE_USERNAME}",user);vars.put("${CPE_PASSWORD}",pass);vars.put("${EXPECTED_MAC}",cfgValue(expected.optString("mac","")));vars.put("${EXPECTED_SERIAL}",cfgValue(expected.optString("serial","")));for(Map.Entry<String,String> e:vars.entrySet())cfg=cfg.replace(e.getKey(),e.getValue());if(Pattern.compile("\\$\\{[A-Z0-9_]+\\}").matcher(cfg).find())throw new IOException("Profilo contiene placeholder non valorizzati");if(!cfg.contains("system.cfg.version="))throw new IOException("Profilo system.cfg non valido");ChannelSftp sf=(ChannelSftp)session.openChannel("sftp");sf.connect(4000);try(InputStream in=new ByteArrayInputStream(cfg.getBytes(StandardCharsets.UTF_8))){sf.put(in,"/tmp/system.cfg");}sf.disconnect();String commitOut=sshExec(session,"cfgmtd -f /tmp/system.cfg -w",20000);JSArray stages=new JSArray();stages.put("SSH CPE verificato");stages.put("Firmware "+targetFw+" verificato");stages.put("Board e MAC verificati");stages.put("system.cfg trasferito");stages.put("Configurazione persistita con cfgmtd");try{ChannelExec reboot=(ChannelExec)session.op