            private String snmpGet(String host,String comm,int[] oid)throws Exception{byte[] ob=oid(oid),vb=seq(concat(tlv(0x06,ob),new byte[]{5,0})),vbl=seq(vb),pdu=tlv(0xA0,concat(new byte[]{2,4,0,0,0,1,2,1,0,2,1,0},vbl)),msg=seq(concat(new byte[]{2,1,1},tlv(4,comm.getBytes(StandardCharsets.US_ASCII)),pdu));DatagramSocket s=new DatagramSocket();try{s.setSoTimeout(2200);s.send(new DatagramPacket(msg,msg.length,InetAddress.getByName(host),161));byte[] r=new byte[4096];DatagramPacket pk=new DatagramPacket(r,r.length);s.receive(pk);int max=pk.getLength();for(int i=0;i<max-2;i++){if((r[i]&255)!=0x06)continue;int[] p={i+1};int l;try{l=berLen(r,p,max);}catch(Exception e){continue;}if(l!=ob.length||p[0]+l>max)continue;boolean same=true;for(int j=0;j<l;j++)if(r[p[0]+j]!=ob[j]){same=false;break;}if(!same)continue;int q=p[0]+l;if(q>=max)break;int tag=r[q++]&255;int[] lp={q};int vl=berLen(r,lp,max);if(lp[0]+vl>max)throw new IOException("Valore SNMP troncato");return snmpValue(tag,r,lp[0],vl);}throw new IOException("OID richiesto non presente nella risposta");}finally{s.close();}}
