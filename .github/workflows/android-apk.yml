name: Build Android Admin Tester APK
on:
  push:
    branches:
      - release/v0.1.0-admin-tester
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android web bundle
        run: |
          mkdir -p android/www/assets
          cp index.html app.js styles.css manifest.webmanifest sw.js android/www/
          cp -R assets/. android/www/assets/
      - name: Install Capacitor
        working-directory: android
        run: npm install
      - name: Create native Android project
        working-directory: android
        run: npx cap add android
      - name: Allow local CPE management traffic in tester build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<application ', '<application android:usesCleartextTraffic="true" ')
          p.write_text(s)
          PY
      - name: Sync and build debug APK
        working-directory: android
        run: npm run build:debug
      - name: Rename APK
        run: cp android/android/app/build/outputs/apk/debug/app-debug.apk CDA-Net-CPE-Configurator-v0.1.0-Admin-Tester.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CDA-Net-CPE-Configurator-v0.1.0-Admin-Tester
          path: CDA-Net-CPE-Configurator-v0.1.0-Admin-Tester.apk
          retention-days: 14
