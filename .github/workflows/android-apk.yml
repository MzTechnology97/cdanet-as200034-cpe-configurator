name: Build Android Admin Tester APK
on:
  push:
    branches: [main, release/v0.1.0-admin-tester]
    paths: ['android/**','index.html','app.js','styles.css','manifest.webmanifest','sw.js','assets/**','.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: android-admin-tester-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Prepare web bundle
        run: |
          rm -rf android/www; mkdir -p android/www/assets
          cp index.html app.js styles.css manifest.webmanifest sw.js android/www/
          cp -R assets/. android/www/assets/
      - name: Install Capacitor dependencies
        working-directory: android
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Create Android native project
        working-directory: android
        run: npx cap add android
      - name: Install full native diagnostics plugin
        run: |
          P=android/android/app/src/main/java/it/cdanet/cpeconfigurator; mkdir -p "$P"
          cat > "$P/NetworkToolsPlugin.java" <<'JAVA'
          package it.cdanet.cpeconfigurator;
          import android.Manifest;import android.content.Context;import android.hardware.*;import android.net.*;import android.net.wifi.*;import android.os.Build;import com.getcapacitor.*;import com.getcapacitor.annotation.*;import java.io.*;import java.net.*;import java.nio.charset.StandardCharsets;import java.util.*;import java.util.concurrent.*;
          @CapacitorPlugin(name="NetworkTools",permissions={@Permission(alias="location",strings={Manifest.permission.ACCESS_FINE_LOCATION}),@Permission(alias="camera",strings={Manifest.permission.CAMERA}),@Permission(alias="nearby",strings={"android.permission.NEARBY_WIFI_DEVICES"})})
          public class NetworkToolsPlugin extends Plugin{
            private final ExecutorService pool=Executors.newCachedThreadPool();
            private boolean local(String h){try{InetAddress a=InetAddress.getByName(h);byte[] b=a.getAddress();if(a.isSiteLocalAddress()||a.isLinkLocalAddress()||a.isLoopbackAddress())return true;return b.length==4&&(b[0]&255)==100&&((b[1]&255)>=64&&(b[1]&255)<=127);}catch(Exception e){return false;}}
            @PluginMethod public void requestPermissions(PluginCall c){String[] a=Build.VERSION.SDK_INT>=33?new String[]{"location","camera","nearby"}:new String[]{"location","camera"};requestPermissionForAliases(a,c,"permissionDone");}
            @PermissionCallback private void permissionDone(PluginCall c){JSObject o=new JSObject();o.put("location",getPermissionState("location").toString());o.put("camera",getPermissionState("camera").toString());if(Build.VERSION.SDK_INT>=33)o.put("nearbyWifi",getPermissionState("nearby").toString());c.resolve(o);}
            @PluginMethod public void sensors(PluginCall c){SensorManager sm=(SensorManager)getContext().getSystemService(Context.SENSOR_SERVICE);JSArray a=new JSArray();for(Sensor s:sm.getSensorList(Sensor.TYPE_ALL)){JSObject x=new JSObject();x.put("name",s.getName());x.put("vendor",s.getVendor());x.put("type",s.getType());x.put("version",s.getVersion());x.put("maxRange",s.getMaximumRange());x.put("resolution",s.getResolution());a.put(x);}JSObject o=new JSObject();o.put("count",a.length());o.put("sensors",a);c.resolve(o);}
            @PluginMethod public void interfaces(PluginCall c){ConnectivityManager cm=(ConnectivityManager)getContext().getSystemService(Context.CONNECTIVITY_SERVICE);JSObject o=new JSObject();Network n=cm.getActiveNetwork();LinkProperties lp=n==null?null:cm.getLinkProperties(n);NetworkCapabilities nc=n==null?null:cm.getNetworkCapabilities(n);if(lp!=null){o.put("interface",lp.getInterfaceName());JSArray a=new JSArray();for(LinkAddress x:lp.getLinkAddresses())a.put(x.toString());o.put("addresses",a);JSArray dns=new JSArray();for(InetAddress x:lp.getDnsServers())dns.put(x.getHostAddress());o.put("dns",dns);JSArray routes=new JSArray();for(RouteInfo r:lp.getRoutes()){routes.put(r.toString());if(r.isDefaultRoute()&&r.getGateway()!=null)o.put("gateway",r.getGateway().getHostAddress());}o.put("routes",routes);o.put("privateDns",lp.getPrivateDnsServerName());for(LinkAddress la:lp.getLinkAddresses()){InetAddress ia=la.getAddress();if(ia instanceof Inet4Address){int p=la.getPrefixLength();byte[] bb=ia.getAddress();long v=((bb[0]&255L)<<24)|((bb[1]&255L)<<16)|((bb[2]&255L)<<8)|(bb[3]&255L);long mask=p==0?0:(0xffffffffL<<(32-p))&0xffffffffL;long net=v&mask;o.put("cidr",((net>>24)&255)+"."+((net>>16)&255)+"."+((net>>8)&255)+"."+(net&255)+"/"+p);break;}}}if(nc!=null){o.put("wifi",nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI));o.put("cellular",nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR));o.put("validated",nc.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED));}c.resolve(o);}
            @PluginMethod public void wifiScan(PluginCall c){pool.execute(()->{WifiManager w=(WifiManager)getContext().getApplicationContext().getSystemService(Context.WIFI_SERVICE);try{w.startScan();try{Thread.sleep(1800);}catch(Exception ignored){}JSArray a=new JSArray();for(ScanResult r:w.getScanResults()){JSObject x=new JSObject();x.put("ssid",Build.VERSION.SDK_INT>=33?(r.getWifiSsid()==null?"":r.getWifiSsid().toString()):r.SSID);x.put("bssid",r.BSSID);x.put("rssi",r.level);x.put("frequencyMHz",r.frequency);x.put("channel",channel(r.frequency));x.put("channelWidth",r.channelWidth);x.put("capabilities",r.capabilities);a.put(x);}JSObject o=new JSObject();o.put("networks",a);c.resolve(o);}catch(SecurityException e){c.reject("Autorizza Nearby Wi-Fi/posizione");}catch(Exception e){c.reject(e.toString());}});}
            private int channel(int f){if(f==2484)return 14;if(f>=2412&&f<=2472)return(f-2407)/5;if(f>=5000&&f<=5895)return(f-5000)/5;if(f>=5955&&f<=7115)return(f-5950)/5;return 0;}
            @PluginMethod public void ping(PluginCall c){String h=c.getString("host");if(h==null){c.reject("host required");return;}pool.execute(()->{try{long t=System.nanoTime();boolean ok=InetAddress.getByName(h).isReachable(1800);JSObject o=new JSObject();o.put("host",h);o.put("reachable",ok);o.put("ms",(System.nanoTime()-t)/1000000);c.resolve(o);}catch(Exception e){c.reject(e.toString());}});}
            @PluginMethod public void dns(PluginCall c){String h=c.getString("host");if(h==null){c.reject("host required");return;}pool.execute(()->{try{JSArray a=new JSArray();for(InetAddress x:InetAddress.getAllByName(h))a.put(x.getHostAddress());JSObject o=new JSObject();o.put("host",h);o.put("addresses",a);c.resolve(o);}catch(Exception e){c.reject(e.toString());}});}
            @PluginMethod public void trace(PluginCall c){String h=c.getString("host");if(h==null){c.reject("host required");return;}pool.execute(()->{JSArray hops=new JSArray();try{InetAddress target=InetAddress.getByName(h);for(int ttl=1;ttl<=20;ttl++){JSObject x=new JSObject();x.put("hop",ttl);long t=System.nanoTime();boolean reached=target.isReachable(null,ttl,900);x.put("ms",(System.nanoTime()-t)/1000000);x.put("reached",reached);hops.put(x);if(reached)break;}JSObject o=new JSObject();o.put("target",target.getHostAddress());o.put("hops",hops);o.put("note","Android API reports TTL reachability; intermediate router addresses may be unavailable without raw ICMP privileges.");c.resolve(o);}catch(Exception e){c.reject(e.toString());}});}
            @PluginMethod public void speedtest(PluginCall c){String host=c.getString("host","speedtest.cda-net.it");int port=c.getInt("port",8080);pool.execute(()->{try{InetAddress a=InetAddress.getByName(host);long[] p=new long[5];int ok=0;for(int i=0;i<5;i++){long t=System.nanoTime();if(a.isReachable(1500)){p[ok++]=(System.nanoTime()-t)/1000000;}}if(ok==0)throw new IOException("Server Speedtest non raggiungibile");double avg=0,jit=0;for(int i=0;i<ok;i++)avg+=p[i];avg/=ok;for(int i=1;i<ok;i++)jit+=Math.abs(p[i]-p[i-1]);if(ok>1)jit/=(ok-1);double down=0,up=0;try{URL u=new URL("http://"+host+":"+port+"/download?size=25000000");HttpURLConnection h=(HttpURLConnection)u.openConnection();h.setConnectTimeout(3000);h.setReadTimeout(10000);long t=System.nanoTime(),bytes=0;try(InputStream in=h.getInputStream()){byte[] b=new byte[65536];for(int n;(n=in.read(b))>0;)bytes+=n;}double sec=(System.nanoTime()-t)/1e9;if(sec>0)down=(bytes*8.0/sec)/1e6;h.disconnect();}catch(Exception ignored){}try{byte[] payload=new byte[4*1024*1024];new Random().nextBytes(payload);URL u=new URL("http://"+host+":"+port+"/upload");HttpURLConnection h=(HttpURLConnection)u.openConnection();h.setDoOutput(true);h.setRequestMethod("POST");h.setConnectTimeout(3000);h.setReadTimeout(10000);h.setFixedLengthStreamingMode(payload.length);long t=System.nanoTime();try(OutputStream out=h.getOutputStream()){out.write(payload);}try{h.getInputStream().close();}catch(Exception ignored){}double sec=(System.nanoTime()-t)/1e9;if(sec>0)up=(payload.length*8.0/sec)/1e6;h.disconnect();}catch(Exception ignored){}JSObject o=new JSObject();o.put("server",host+":"+port);o.put("pingMs",Math.round(avg));o.put("jitterMs",Math.round(jit));o.put("packetLoss",Math.round((5-ok)*20.0));o.put("downloadMbps",Math.round(down*10.0)/10.0);o.put("uploadMbps",Math.round(up*10.0)/10.0);o.put("note",(down==0||up==0)?"Il server non espone gli endpoint HTTP legacy attesi; per misure Ookla ufficiali serve l'SDK/licenza Ookla.":"Test HTTP CDA Net completato.");c.resolve(o);}catch(Exception e){c.reject("Speed Test: "+e.getMessage());}});}
            private boolean privateHost(String h){return local(h);}
            @PluginMethod public void openRtsp(PluginCall c){String h=c.getString("host"),path=c.getString("path","/Streaming/Channels/101"),user=c.getString("username",""),pass=c.getString("password","");int port=c.getInt("port",554);if(h==null||!privateHost(h)){c.reject("IP camera locale/CGNAT autorizzato richiesto");return;}android.content.Intent i=new android.content.Intent(getContext(),RtspPlayerActivity.class);i.putExtra("host",h);i.putExtra("port",port);i.putExtra("path",path);i.putExtra("username",user);i.putExtra("password",pass);getActivity().startActivity(i);JSObject o=new JSObject();o.put("opened",true);o.put("host",h);o.put("port",port);o.put("path",path);c.resolve(o);}
            @PluginMethod public void cameraProbe(PluginCall c){String h=c.getString("host");int rtsp=c.getInt("rtspPort",554);if(h==null||!privateHost(h)){c.reject("IP locale/privato richiesto");return;}pool.execute(()->{try{JSObject o=new JSObject();o.put("host",h);int[] ports={80,443,rtsp,8000,8080,8899};JSArray open=new JSArray();for(int p:ports){try(Socket x=new Socket()){x.connect(new InetSocketAddress(h,p),500);open.put(p);}catch(Exception ignored){}}o.put("openPorts",open);o.put("rtspPort",rtsp);o.put("reachable",InetAddress.getByName(h).isReachable(1200));try{o.put("hostname",InetAddress.getByName(h).getCanonicalHostName());}catch(Exception ignored){}c.resolve(o);}catch(Exception e){c.reject("Camera probe: "+e.getMessage());}});}
            @PluginMethod public void onvifDiscovery(PluginCall c){pool.execute(()->{DatagramSocket sock=null;try{String id=UUID.randomUUID().toString();String xml="<?xml version=\"1.0\" encoding=\"UTF-8\"?><e:Envelope xmlns:e=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:w=\"http://schemas.xmlsoap.org/ws/2004/08/addressing\" xmlns:d=\"http://schemas.xmlsoap.org/ws/2005/04/discovery\" xmlns:dn=\"http://www.onvif.org/ver10/network/wsdl\"><e:Header><w:MessageID>uuid:"+id+"</w:MessageID><w:To e:mustUnderstand=\"true\">urn:schemas-xmlsoap-org:ws:2005:04:discovery</w:To><w:Action e:mustUnderstand=\"true\">http://schemas.xmlsoap.org/ws/2005/04/discovery/Probe</w:Action></e:Header><e:Body><d:Probe><d:Types>dn:NetworkVideoTransmitter</d:Types></d:Probe></e:Body></e:Envelope>";byte[] q=xml.getBytes(StandardCharsets.UTF_8);sock=new DatagramSocket();sock.setSoTimeout(900);sock.send(new DatagramPacket(q,q.length,InetAddress.getByName("239.255.255.250"),3702));JSArray devices=new JSArray();long end=System.currentTimeMillis()+3500;Set<String> seen=new HashSet<>();while(System.currentTimeMillis()<end){try{byte[] b=new byte[8192];DatagramPacket p=new DatagramPacket(b,b.length);sock.receive(p);String body=new String(p.getData(),0,p.getLength(),StandardCharsets.UTF_8);String ip=p.getAddress().getHostAddress();if(seen.add(ip)){JSObject x=new JSObject();x.put("ip",ip);x.put("sourcePort",p.getPort());java.util.regex.Matcher m=java.util.regex.Pattern.compile("(?i)<[^>]*XAddrs[^>]*>([^<]+)").matcher(body);if(m.find())x.put("xaddrs",m.group(1));java.util.regex.Matcher n=java.util.regex.Pattern.compile("(?i)<[^>]*Scopes[^>]*>([^<]+)").matcher(body);if(n.find())x.put("scopes",n.group(1));devices.put(x);}}catch(SocketTimeoutException ignored){}}JSObject o=new JSObject();o.put("protocol","ONVIF WS-Discovery");o.put("devices",devices);o.put("count",devices.length());c.resolve(o);}catch(Exception e){c.reject("ONVIF discovery: "+e.getMessage());}finally{if(sock!=null)sock.close();}});}
            @PluginMethod public void hikDiscovery(PluginCall c){pool.execute(()->{DatagramSocket sock=null;try{String uuid=UUID.randomUUID().toString();String xml="<?xml version=\"1.0\" encoding=\"utf-8\"?><Probe><Uuid>"+uuid+"</Uuid><Types>inquiry</Types></Probe>";byte[] q=xml.getBytes(StandardCharsets.UTF_8);sock=new DatagramSocket();sock.setSoTimeout(900);sock.send(new DatagramPacket(q,q.length,InetAddress.getByName("239.255.255.250"),37020));JSArray devices=new JSArray();long end=System.currentTimeMillis()+3500;Set<String> seen=new HashSet<>();while(System.currentTimeMillis()<end){try{byte[] b=new byte[8192];DatagramPacket p=new DatagramPacket(b,b.length);sock.receive(p);String body=new String(p.getData(),0,p.getLength(),StandardCharsets.UTF_8);String ip=p.getAddress().getHostAddress();if(seen.add(ip)){JSObject x=new JSObject();x.put("ip",ip);x.put("sourcePort",p.getPort());String[] tags={"DeviceDescription","DeviceSN","MAC","IPv4Address","IPv4Gateway","IPv4SubnetMask","HttpPort","SoftwareVersion","DSPVersion","BootTime"};for(String tag:tags){java.util.regex.Matcher m=java.util.regex.Pattern.compile("(?i)<"+tag+">([^<]*)</"+tag+">").matcher(body);if(m.find())x.put(tag,m.group(1));}devices.put(x);}}catch(SocketTimeoutException ignored){}}JSObject o=new JSObject();o.put("protocol","Hikvision SADP discovery");o.put("devices",devices);o.put("count",devices.length());o.put("note","Solo discovery locale; attivazione e cambio credenziali richiedono API/procedure vendor supportate.");c.resolve(o);}catch(Exception e){c.reject("Hikvision discovery: "+e.getMessage());}finally{if(sock!=null)sock.close();}});}
            @PluginMethod public void neighbors(PluginCall c){pool.execute(()->{JSArray a=new JSArray();try{BufferedReader b=new BufferedReader(new FileReader("/proc/net/arp"));String s;b.readLine();while((s=b.readLine())!=null){String[]p=s.trim().split("\\s+");if(p.length>=6){JSObject x=new JSObject();x.put("ip",p[0]);x.put("mac",p[3]);x.put("interface",p[5]);a.put(x);}}b.close();}catch(Exception ignored){}JSObject o=new JSObject();o.put("neighbors",a);o.put("note","Android può limitare /proc/net/arp nelle versioni recenti.");c.resolve(o);});}
            @PluginMethod public void discover(PluginCall c){String cidr=c.getString("cidr");if(cidr==null){c.reject("cidr required");return;}String ip=cidr.split("/")[0];if(!local(ip)){c.reject("Sono consentite solo reti locali/private autorizzate");return;}int mask=24;try{if(cidr.contains("/"))mask=Integer.parseInt(cidr.split("/")[1]);}catch(Exception ignored){}if(mask<24){c.reject("Per sicurezza la scansione mobile è limitata a /24 o reti più piccole");return;}pool.execute(()->{JSArray a=new JSArray();try{String base=ip.substring(0,ip.lastIndexOf('.')+1);for(int i=1;i<255;i++){InetAddress z=InetAddress.getByName(base+i);if(z.isReachable(70)){JSObject x=new JSObject();x.put("ip",z.getHostAddress());x.put("hostname",z.getCanonicalHostName());a.put(x);}}JSObject o=new JSObject();o.put("cidr",cidr);o.put("hosts",a);c.resolve(o);}catch(Exception e){c.reject(e.toString());}});}
            @PluginMethod public void netbios(PluginCall c){String h=c.getString("host");if(h==null||!local(h)){c.reject("Host locale richiesto");return;}pool.execute(()->{try{byte[] q=nbQuery();DatagramSocket s=new DatagramSocket();s.setSoTimeout(1800);s.send(new DatagramPacket(q,q.length,InetAddress.getByName(h),137));byte[] b=new byte[1024];DatagramPacket p=new DatagramPacket(b,b.length);s.receive(p);s.close();JSObject o=new JSObject();o.put("host",h);o.put("responseBytes",p.getLength());o.put("netbiosNames",parseNb(b,p.getLength()));c.resolve(o);}catch(Exception e){c.reject("NetBIOS non disponibile: "+e.getMessage());}});}
            private byte[] nbQuery(){byte[] q=new byte[50];q[0]=0x43;q[1]=0x44;q[4]=0;q[5]=1;q[12]=32;for(int i=0;i<16;i++){int v=i==0?'*':' ';q[13+i*2]=(byte)('A'+((v>>4)&15));q[14+i*2]=(byte)('A'+(v&15));}q[45]=0;q[46]=0;q[47]=0x21;q[48]=0;q[49]=1;return q;}
            private JSArray parseNb(byte[] b,int n){JSArray a=new JSArray();for(int i=57;i+18<n;i+=18){int len=b[i-1]&255;if(len>0&&len<100){String name=new String(b,i,15,StandardCharsets.US_ASCII).trim();if(!name.isEmpty())a.put(name);}}return a;}
            @PluginMethod public void snmp(PluginCall c){String h=c.getString("host"),community=c.getString("community","public");if(h==null||!local(h)){c.reject("Host SNMP locale richiesto");return;}pool.execute(()->{try{JSObject o=new JSObject();o.put("host",h);o.put("sysDescr",snmpGet(h,community,new int[]{1,3,6,1,2,1,1,1,0}));o.put("sysName",snmpGet(h,community,new int[]{1,3,6,1,2,1,1,5,0}));o.put("sysUpTime",snmpGet(h,community,new int[]{1,3,6,1,2,1,1,3,0}));c.resolve(o);}catch(Exception e){c.reject("SNMP v2c: "+e.getMessage());}});}
            private String snmpGet(String host,String comm,int[] oid)throws Exception{byte[] ob=oid(oid),vb=seq(concat(tlv(0x06,ob),new byte[]{5,0})),vbl=seq(vb),pdu=tlv(0xA0,concat(new byte[]{2,4,0,0,0,1,2,1,0,2,1,0},vbl)),msg=seq(concat(new byte[]{2,1,1},tlv(4,comm.getBytes(StandardCharsets.US_ASCII)),pdu));DatagramSocket s=new DatagramSocket();s.setSoTimeout(1800);s.send(new DatagramPacket(msg,msg.length,InetAddress.getByName(host),161));byte[] r=new byte[2048];DatagramPacket p=new DatagramPacket(r,r.length);s.receive(p);s.close();for(int i=0;i<p.getLength()-2;i++){if((r[i]&255)==4){int l=r[i+1]&255;if(l>0&&l<128&&i+2+l<=p.getLength())return new String(r,i+2,l,StandardCharsets.UTF_8);}if((r[i]&255)==0x43){int l=r[i+1]&255;if(l>0&&l<=4&&i+2+l<=p.getLength()){long v=0;for(int j=0;j<l;j++)v=(v<<8)|(r[i+2+j]&255);return v+" ticks";}}}return "risposta ricevuta ("+p.getLength()+" byte)";}
            private byte[] oid(int[] a)throws Exception{ByteArrayOutputStream o=new ByteArrayOutputStream();o.write(a[0]*40+a[1]);for(int i=2;i<a.length;i++){int v=a[i];int[] st=new int[5];int n=0;do{st[n++]=v&127;v>>=7;}while(v>0);for(int j=n-1;j>=0;j--)o.write(st[j]|(j>0?128:0));}return o.toByteArray();}
            private byte[] tlv(int tag,byte[] v)throws Exception{ByteArrayOutputStream o=new ByteArrayOutputStream();o.write(tag);if(v.length<128)o.write(v.length);else{o.write(0x82);o.write((v.length>>8)&255);o.write(v.length&255);}o.write(v);return o.toByteArray();}
            private byte[] seq(byte[] v)throws Exception{return tlv(0x30,v);}private byte[] concat(byte[]...x)throws Exception{ByteArrayOutputStream o=new ByteArrayOutputStream();for(byte[] b:x)o.write(b);return o.toByteArray();}
          }
          JAVA
          cat > "$P/RtspPlayerActivity.java" <<'JAVA'
          package it.cdanet.cpeconfigurator;
          import android.app.Activity;import android.net.Uri;import android.os.Bundle;import android.view.*;import android.widget.*;import androidx.media3.common.MediaItem;import androidx.media3.exoplayer.ExoPlayer;import androidx.media3.ui.PlayerView;
          public class RtspPlayerActivity extends Activity{
            private ExoPlayer player;
            @Override public void onCreate(Bundle b){super.onCreate(b);getWindow().setStatusBarColor(0xff111111);LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(0xff111111);TextView title=new TextView(this);title.setText("CDA Net · RTSP Viewer");title.setTextColor(0xffffffff);title.setTextSize(20);title.setPadding(24,24,24,16);root.addView(title);PlayerView view=new PlayerView(this);root.addView(view,new LinearLayout.LayoutParams(-1,0,1));Button close=new Button(this);close.setText("Chiudi stream");close.setOnClickListener(v->finish());root.addView(close);setContentView(root);String host=getIntent().getStringExtra("host"),path=getIntent().getStringExtra("path"),u=getIntent().getStringExtra("username"),p=getIntent().getStringExtra("password");int port=getIntent().getIntExtra("port",554);String auth=(u!=null&&!u.isEmpty())?Uri.encode(u)+(p!=null&&!p.isEmpty()?":"+Uri.encode(p):"")+"@":"";Uri uri=Uri.parse("rtsp://"+auth+host+":"+port+(path.startsWith("/")?path:"/"+path));player=new ExoPlayer.Builder(this).build();view.setPlayer(player);player.setMediaItem(MediaItem.fromUri(uri));player.prepare();player.play();}
            @Override protected void onStop(){super.onStop();if(player!=null){player.release();player=null;}}
          }
          JAVA
          MAIN=$(find android/android/app/src/main/java -name MainActivity.java | head -1)
          cat > "$MAIN" <<'JAVA'
          package it.cdanet.cpeconfigurator;
          import android.os.Bundle;import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity{@Override public void onCreate(Bundle b){registerPlugin(NetworkToolsPlugin.class);super.onCreate(b);}}
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/android/app/src/main/AndroidManifest.xml');s=p.read_text();perms='''<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n<uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />\n'''
          if 'ACCESS_WIFI_STATE' not in s:s=s.replace('<application',perms+'<application',1)
          if 'usesCleartextTraffic' not in s:s=s.replace('<application ','<application android:usesCleartextTraffic="true" ',1)
          if 'RtspPlayerActivity' not in s:s=s.replace('</application>','<activity android:name=".RtspPlayerActivity" android:screenOrientation="sensorLandscape" android:exported="false" /></application>')
          p.write_text(s)
          PY
      - name: Add Media3 RTSP viewer dependencies
        run: |
          cat >> android/android/app/build.gradle <<'GRADLE'
          dependencies {
            implementation "androidx.media3:media3-exoplayer:1.8.0"
            implementation "androidx.media3:media3-exoplayer-rtsp:1.8.0"
            implementation "androidx.media3:media3-ui:1.8.0"
          }
          GRADLE
      - name: Sync Capacitor
        working-directory: android
        run: npx cap sync android
      - name: Set Android v0.1.9 metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/android/app/build.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+', 'versionCode 19', s)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "0.1.9"', s)
          p.write_text(s)
          PY
      - name: Verify full v0.1.9 bundle
        run: |
          grep -R 'package it.cdanet.cpeconfigurator;' android/android/app/src/main/java
          grep -q 'it.cdanet.cpeconfigurator' android/capacitor.config.json
          grep -q 'v0.1.9' android/www/index.html
          grep -q 'requestPermissions' android/www/app.js
          grep -q 'snmpGet' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'netbios' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'sensors' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'speedtest' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'onvifDiscovery' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'hikDiscovery' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'cameraProbe' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'openRtsp' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'RtspPlayerActivity' android/android/app/src/main/AndroidManifest.xml
          grep -q 'media3-exoplayer-rtsp' android/android/app/build.gradle
          grep -q 'o.put("cidr"' android/android/app/src/main/java/it/cdanet/cpeconfigurator/NetworkToolsPlugin.java
          grep -q 'versionName "0.1.8"' android/android/app/build.gradle
          grep -q 'ACCESS_FINE_LOCATION' android/android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Stage APK artifact
        run: |
          cp android/android/app/build/outputs/apk/debug/app-debug.apk CDA-Net-CPE.apk
          sha256sum CDA-Net-CPE.apk > CDA-Net-CPE.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CDA-Net-CPE
          path: |
            CDA-Net-CPE.apk
            CDA-Net-CPE.apk.sha256
          if-no-files-found: error
          retention-days: 14
