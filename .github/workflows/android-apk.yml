            private int berLen(byte[] b,int[] p,int max)throws IOException{if(p[0]>=max)throw new IOException("BER incompleto");int n=b[p[0]++]&255;if((n&128)==0)return n;int bytes=n&127;if(bytes<1||bytes>3||p[0]+bytes>max)throw new IOException("Lunghezza BER non valida");int len=0;for(int i=0;i<bytes;i++)len=(len<<8)|(b[p[0]++]&255);return len;}
