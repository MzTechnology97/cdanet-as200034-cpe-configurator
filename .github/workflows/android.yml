name: Android

on:
  push:
    branches: [main, 'rewrite/**']
    tags: ['v*']
    paths: ['android/**', 'VERSION', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'VERSION', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - id: v
        run: |
          v=$(cat VERSION)
          a=$(echo "$v" | cut -d. -f1); b=$(echo "$v" | cut -d. -f2); c=$(echo "$v" | cut -d. -f3)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((a*10000+b*100+c))" >> "$GITHUB_OUTPUT"
      - name: Unit tests and debug build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Signed release build
        id: release
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Signing secrets not configured: debug APK only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" gradle --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Stage artifacts
        run: |
          set -eu
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/CDA-Net-CPE-${{ steps.v.outputs.version }}-debug.apk"
          if [ "${{ steps.release.outputs.signed }}" = "true" ]; then
            f="CDA-Net-CPE-${{ steps.v.outputs.version }}.apk"
            cp android/app/build/outputs/apk/release/app-release.apk "out/$f"
            sha=$(sha256sum "out/$f" | cut -d' ' -f1)
            printf '{"versionCode":%s,"versionName":"%s","sha256":"%s","fileName":"%s","mandatory":false}\n' \
              "${{ steps.v.outputs.code }}" "${{ steps.v.outputs.version }}" "$sha" "$f" > out/latest.json
          fi
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: CDA-Net-CPE-${{ steps.v.outputs.version }}
          path: out/
          retention-days: 30
      # The server downloads latest.json + APK from the newest GitHub Release (ANDROID_RELEASE_GITHUB_REPO).
      - name: Publish GitHub Release
        if: steps.release.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists: bump /VERSION to publish a new APK."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "CDA Net CPE $tag" \
            --notes "APK firmato ${{ steps.v.outputs.version }} (versionCode ${{ steps.v.outputs.code }}). Il server lo scarica automaticamente." \
            "out/CDA-Net-CPE-${{ steps.v.outputs.version }}.apk" out/latest.json out/SHA256SUMS
