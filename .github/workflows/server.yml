name: Server

on:
  push:
    branches: [main, 'rewrite/**']
    tags: ['v*']
    paths: ['server/**', 'web/**', 'deploy/**', 'VERSION', 'scripts/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'web/**', 'deploy/**', 'VERSION', 'scripts/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mztechnology97/cdanet-cpe-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: node scripts/check-version.mjs
      - name: Install
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Unit and API tests
        working-directory: server
        run: npm test
      - name: Web console syntax
        run: for f in $(find web/js -name '*.js'); do node --check "$f"; done
      - name: Shell scripts
        run: for f in deploy/*.sh deploy/updater/*.sh deploy/cdanet-cpe; do bash -n "$f"; done
      - name: Secret scan
        run: |
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}'; then
            echo "Possible secret committed"; exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Compose file is valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config -q
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: cdanet-smoke:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (non-root runtime, health, login, backup)
        run: |
          set -eu
          openssl rand -base64 32 > "$RUNNER_TEMP/master.key"
          sudo chown 0:0 "$RUNNER_TEMP/master.key"; sudo chmod 0400 "$RUNNER_TEMP/master.key"
          docker run -d --name smoke -p 18787:8787 --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            -e JWT_SECRET=ci-secret-0123456789abcdefghijklmnopqrstuvwxyz \
            -e ADMIN_USERNAME=adminci -e ADMIN_PASSWORD=CI-Admin-Password-1234 \
            -v "$RUNNER_TEMP/master.key:/run/secrets/cdanet_master_key:ro" cdanet-smoke:ci
          ok=0
          for i in $(seq 1 40); do if curl -fsS localhost:18787/api/health; then ok=1; break; fi; sleep 1; done
          docker logs smoke
          test "$ok" = 1
          echo "step: web console"; curl -fsS localhost:18787/ | grep -q 'CPE Admin'
          echo "step: login"; curl -fsS -H 'content-type: application/json' -d '{"username":"adminci","password":"CI-Admin-Password-1234"}' localhost:18787/api/auth/login | grep -q token
          echo "step: backup"; docker exec -u node smoke node src/cli/backup.ts ci | grep -q '/data/backups/'
          echo "step: runs as node"
          docker exec smoke ps -o pid,user,args
          # The server process (Node renames it "{MainThread} node src/main.ts") must not be root; tini (PID 1) is.
          user=$(docker exec smoke ps -o user,args | grep 'src/main.ts' | grep -v tini | awk '{print $1}' | sort -u)
          echo "server process user: $user"; test "$user" = node
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,prefix=branch-
            type=sha,prefix=sha-
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
