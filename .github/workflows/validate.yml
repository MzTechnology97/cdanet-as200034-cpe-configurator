name: Validate PWA backend and Docker
on:
  push:
    branches:
      - main
      - develop/tc2-secure-provisioning
      - 'release/**'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript
        run: node --check app.js && node --check sw.js
      - name: Full project release gate
        run: node scripts/verify-project.mjs
      - name: Shell syntax checks
        run: |
          for f in deploy/*.sh web-agent/*.sh; do bash -n "$f"; done
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Verify required PWA assets
        run: test -f index.html && test -f styles.css && test -f assets/cda-net-logo.svg && test -f assets/icon.svg
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Check backend JavaScript
        working-directory: server
        run: |
          node --check src/server.js
          node --check src/tools.js
          node --check src/routeros.js
          node --check src/reset-admin-password.js
      - name: Backend auth and updater smoke test
        run: |
          set -euo pipefail
          trap 'code=$?; echo "::group::Backend smoke failure diagnostics"; cat /tmp/cdanet-ci/server.log 2>/dev/null || true; echo "::endgroup::"; exit $code' ERR
          step(){ echo "SMOKE: $1"; }
          mkdir -p /tmp/cdanet-ci/data /tmp/cdanet-ci/releases
          openssl rand -base64 32 > /tmp/cdanet-ci/master.key
          printf 'fake-apk-ci' > /tmp/cdanet-ci/releases/CDA-Net-CPE-9.9.9.apk
          SHA=$(sha256sum /tmp/cdanet-ci/releases/CDA-Net-CPE-9.9.9.apk | awk '{print $1}')
          printf '{"versionCode":999,"versionName":"9.9.9","sha256":"%s","fileName":"CDA-Net-CPE-9.9.9.apk","mandatory":false}\n' "$SHA" > /tmp/cdanet-ci/releases/latest.json
          (
            cd server
            PORT=18787 \
            JWT_SECRET=ci-jwt-secret-abcdefghijklmnopqrstuvwxyz0123456789 \
            ADMIN_USERNAME=adminci \
            ADMIN_PASSWORD='CI-Admin-Password-1234' \
            SECRETS_KEY_FILE=/tmp/cdanet-ci/master.key \
            DB_PATH=/tmp/cdanet-ci/data/test.sqlite \
            STATIC_DIR="$GITHUB_WORKSPACE" \
            ANDROID_RELEASE_DIR=/tmp/cdanet-ci/releases \
            ALLOWED_ORIGIN=https://localhost \
            node src/server.js >/tmp/cdanet-ci/server.log 2>&1 &
            echo $! >/tmp/cdanet-ci/pid
          )
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18787/api/health >/tmp/cdanet-ci/health.json && break || sleep .25; done
          step "health/version"; grep -q '"version":"0.5.1"' /tmp/cdanet-ci/health.json
          step "android update metadata"; curl --fail-with-body -sS http://127.0.0.1:18787/api/mobile/update | tee /tmp/cdanet-ci/update.json | grep -q '"versionCode":999'
          step "android APK download"; curl --fail-with-body -sS http://127.0.0.1:18787/api/mobile/apk -o /tmp/cdanet-ci/download.apk
          test "$(sha256sum /tmp/cdanet-ci/download.apk | awk '{print $1}')" = "$SHA"
          step "admin login"; curl --fail-with-body -sS -H 'Content-Type: application/json' -d '{"username":"adminci","password":"CI-Admin-Password-1234"}' http://127.0.0.1:18787/api/login > /tmp/cdanet-ci/login.json
          TOKEN=$(node -e "const j=require('/tmp/cdanet-ci/login.json');process.stdout.write(j.token||'')")
          test -n "$TOKEN"
          AUTH="Authorization: Bearer $TOKEN"
          step "admin users list"; curl --fail-with-body -sS -H "$AUTH" http://127.0.0.1:18787/api/admin/users | tee /tmp/cdanet-ci/admin-users.json | grep -q 'adminci'
          step "installer create"; curl --fail-with-body -sS -H "$AUTH" -H 'Content-Type: application/json' -d '{"username":"installerci","password":"Installer-CI-Password-123"}' http://127.0.0.1:18787/api/users | tee /tmp/cdanet-ci/create-user.json | grep -q '"ok":true'
          curl -fsS -H "$AUTH" http://127.0.0.1:18787/api/admin/users > /tmp/cdanet-ci/users.json
          USER_ID=$(node -e "const j=require('/tmp/cdanet-ci/users.json');const x=j.find(v=>v.username==='installerci');process.stdout.write(String(x?.id||''))")
          test -n "$USER_ID"
          step "installer reset"; curl --fail-with-body -sS -X PUT -H "$AUTH" -H 'Content-Type: application/json' -d '{"password":"Installer-CI-Reset-Password-456","active":true}' "http://127.0.0.1:18787/api/admin/users/$USER_ID" | tee /tmp/cdanet-ci/reset-user.json | grep -q '"ok":true'
          curl -fsS -H 'Content-Type: application/json' -d '{"username":"installerci","password":"Installer-CI-Reset-Password-456"}' http://127.0.0.1:18787/api/login | grep -q '"token"'
          step "offline audit sync"; curl --fail-with-body -sS -H "$AUTH" -H 'Content-Type: application/json' -d '{"ssid":"CDA-NET-N2-D01","pppoeUser":"ROSSI.MARIO@cda-net.it","model":"LiteBeam 5AC","mac":"AA:BB:CC:DD:EE:FF","serial":"CI123","result":"success"}' http://127.0.0.1:18787/api/mobile/provision-result | tee /tmp/cdanet-ci/audit-post.json | grep -q '"ok":true'
          curl -fsS -H "$AUTH" http://127.0.0.1:18787/api/audits | grep -q 'ROSSI.MARIO@cda-net.it'
          step "tools interfaces"; curl --fail-with-body -sS -H "$AUTH" http://127.0.0.1:18787/api/tools/interfaces | tee /tmp/cdanet-ci/interfaces.json | grep -q '"source":"backend"'
          step "tools dns"; curl --fail-with-body -sS -H "$AUTH" -H 'Content-Type: application/json' -d '{"host":"localhost"}' http://127.0.0.1:18787/api/tools/dns | tee /tmp/cdanet-ci/dns.json | grep -q '"addresses"'
          step "tools speed ping"; curl --fail-with-body -sS -H "$AUTH" http://127.0.0.1:18787/api/tools/speed/ping | tee /tmp/cdanet-ci/speed.json | grep -q '"ok":true'
          DRY='{"model":"LiteBeam 5AC","firmware":"8.7.4","mac":"AA:BB:CC:DD:EE:FF","serial":"CI123","ssid":"CDA-NET-N2-D01","pppoeUser":"ROSSI.MARIO@cda-net.it","pppoePassword":"transient-ci"}'
          step "provision dry run"; curl --fail-with-body -sS -H "$AUTH" -H 'Content-Type: application/json' -d "$DRY" http://127.0.0.1:18787/api/provision/dry-run | tee /tmp/cdanet-ci/dry.json | grep -q '"targetFirmware":"8.7.4"'
          step "reject legacy VLAN profile"
          BAD_PROFILE=$(node - <<'NODE'
          const template=['system.cfg.version=65547','vlan.1.id=87','vlan.1.status=enabled','wireless.1.status=enabled','# filler filler filler filler filler filler filler filler filler filler filler filler'].join('\n');
          process.stdout.write(JSON.stringify({template,boardMatch:'board.model=LBE-5AC'}));
          NODE
          )
          CODE=$(curl -sS -o /tmp/cdanet-ci/vlan.json -w '%{http_code}' -X PUT -H "$AUTH" -H 'Content-Type: application/json' --data-binary "$BAD_PROFILE" 'http://127.0.0.1:18787/api/admin/provision-profiles/LiteBeam%205AC/8.7.4')
          echo "VLAN rejection HTTP=$CODE body=$(cat /tmp/cdanet-ci/vlan.json)"
          test "$CODE" = "400"
          grep -q 'profile_contains_vlan' /tmp/cdanet-ci/vlan.json
          kill "$(cat /tmp/cdanet-ci/pid)" 2>/dev/null || true
      - name: Check Web Bridge JavaScript
        run: node --check web-agent/server.mjs
      - name: Validate Docker Compose
        env:
          FIRMWARE_HOST_PATH: /tmp/WA-8.7.4.bin
          APP_DOMAIN: tc2.invalid
        run: |
          touch /tmp/WA-8.7.4.bin
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config >/dev/null
      - name: Validate Caddy configuration
        run: |
          docker run --rm             -e APP_LISTEN=:80             -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"             caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build application image
        run: docker build -f deploy/Dockerfile -t cdanet-cpe-configurator:tc2 .
