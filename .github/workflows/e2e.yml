name: Installer e2e

# Runs the real deploy/install-debian.sh in a Debian 12 container that drives the
# runner's Docker (same host paths are bind-mounted, as on a real server), with the
# image built from this commit and a tiny OSM extract for the local Nominatim.

on:
  push:
    branches: [main]
    paths: ['deploy/**', 'server/**', 'web/**', 'VERSION', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['deploy/**', 'server/**', 'web/**', 'VERSION', '.github/workflows/e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ADMIN_PW: E2e-Admin-Password-1
      PROJECT: cdanet-cpe-configurator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image of this commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: cdanet-e2e:ci
          build-args: |
            VERSION=e2e
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Debian 12 "server" with Docker CLI
        run: |
          sudo mkdir -p /opt/cdanet-cpe /etc/cdanet-cpe /srv/cdanet-private /root/.docker
          docker run -d --name srv \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /opt/cdanet-cpe:/opt/cdanet-cpe -v /etc/cdanet-cpe:/etc/cdanet-cpe -v /srv/cdanet-private:/srv/cdanet-private \
            -v "$PWD:/src:ro" debian:12 sleep infinity
          docker exec srv bash -euc '
            apt-get update -qq && apt-get install -y -qq ca-certificates curl >/dev/null
            install -m0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
            echo "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" >/etc/apt/sources.list.d/docker.list
            apt-get update -qq && apt-get install -y -qq docker-ce-cli docker-compose-plugin >/dev/null
            docker version --format "server {{.Server.Version}}"'

      - name: First install (unattended, local OpenStreetMap)
        run: |
          docker exec \
            -e CDANET_ADMIN_USER=admin -e CDANET_ADMIN_PASSWORD="$ADMIN_PW" \
            -e CDANET_GEOCODER=local -e CDANET_GEOCODER_REGION=custom -e CDANET_MAP=off \
            -e CDANET_GEOCODER_PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
            -e CDANET_GEOCODER_REPLICATION_URL= \
            -e CDANET_IMAGE=cdanet-e2e -e CDANET_CHANNEL=ci -e CDANET_SKIP_PULL=1 \
            srv /src/deploy/install-debian.sh

      - name: App reachable through Caddy, admin login works
        run: |
          curl -fsS http://localhost/api/health | tee /dev/stderr | grep -q '"ok":true'
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PW\"}" http://localhost/api/auth/login | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != null
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # the first-boot admin password must not remain in the container environment
          env_of_app=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$(docker ps -qf "label=com.docker.compose.project=$PROJECT" -f label=com.docker.compose.service=app)")
          if echo "$env_of_app" | grep -Eq '^ADMIN_PASSWORD=.+'; then echo "ADMIN_PASSWORD still in the app container"; exit 1; fi
          app=$(docker ps -qf "label=com.docker.compose.project=$PROJECT" -f label=com.docker.compose.service=app)
          echo "app restarts: $(docker inspect -f '{{.RestartCount}}' "$app")"
          test "$(docker inspect -f '{{.RestartCount}}' "$app")" = 0

      - name: Local Nominatim imports and answers the app
        run: |
          n=$(docker ps -qf "label=com.docker.compose.project=$PROJECT" -f label=com.docker.compose.service=nominatim)
          for i in $(seq 1 120); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$n")
            [ "$s" = healthy ] && break
            [ $((i % 10)) = 0 ] && docker logs --tail 3 "$n" 2>&1 | sed 's/^/  nominatim> /'
            sleep 10
          done
          echo "nominatim: $s"; test "$s" = healthy
          docker exec srv cdanet-cpe geocoder
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' \
            http://localhost/api/admin/connectors/geocoder/test | tee /dev/stderr | jq -e '.primary.ok and .primary.local' >/dev/null
          app=$(docker ps -qf "label=com.docker.compose.project=$PROJECT" -f label=com.docker.compose.service=app)
          docker exec "$app" wget -qO- 'http://nominatim:8080/search?q=Monaco&format=jsonv2' | jq -e 'length > 0' >/dev/null

      - name: Re-running the installer keeps the stack up
        run: |
          app=$(docker ps -qf "label=com.docker.compose.project=$PROJECT" -f label=com.docker.compose.service=app)
          docker exec -e CDANET_SKIP_PULL=1 srv /src/deploy/install-debian.sh
          app2=$(docker ps -qf "label=com.docker.compose.project=$PROJECT" -f label=com.docker.compose.service=app)
          echo "app container before=$app after=$app2"
          test "$app" = "$app2"
          curl -fsS http://localhost/api/health | grep -q '"ok":true'
          docker exec srv cdanet-cpe ps

      - name: Map (Protomaps) download and serving
        run: |
          docker exec -e CDANET_SKIP_PULL=1 -e CDANET_MAP=local -e CDANET_MAP_REGION=custom -e CDANET_MAP_BBOX=7.40,43.72,7.44,43.75             srv /src/deploy/install-debian.sh
          docker exec srv cdanet-cpe map
          curl -fsS -H 'Range: bytes=0-6' http://localhost/map/basemap.pmtiles | grep -q PMTiles
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PW\"}" http://localhost/api/auth/login | jq -r .token)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost/api/map/config | tee /dev/stderr | jq -e '.basemap.maxZoom == 15 and (.basemap.bounds[0] | floor) == 7' >/dev/null

      - name: Infrastructure settings from the console (updater agent, no SSH)
        run: |
          H="Authorization: Bearer $TOKEN"
          for i in $(seq 1 30); do curl -fsS -H "$H" http://localhost/api/admin/infra | jq -e .agent >/dev/null && break; sleep 3; done
          curl -fsS -H "$H" http://localhost/api/admin/infra | tee /dev/stderr | jq -e '.agent and .values.MAP_REGION == "custom"' >/dev/null
          # Caddy may be restarting after the previous step: retry; 409 = the request already went through
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/put.json -w '%{http_code}' -X PUT -H "$H" -H 'Content-Type: application/json' \
              -d '{"values":{"UPDATE_WINDOW":"02-05","HTTPS_SITES":"https://localhost https://127.0.0.1","HTTPS_DEFAULT_SNI":"127.0.0.1"}}' \
              http://localhost/api/admin/infra || true)
            echo "PUT infra: $code"
            [ "$code" = 202 ] || [ "$code" = 409 ] && break
            sleep 3
          done
          [ "$code" = 202 ] || [ "$code" = 409 ]
          for i in $(seq 1 40); do
            # Caddy and the app restart while the agent applies the change: a dropped connection is retried
            s=$(curl -fsS -H "$H" http://localhost/api/admin/infra || true)
            echo "$s" | jq -e '(.pending | not) and .status.result == "ok"' >/dev/null 2>&1 && break
            sleep 3
          done
          echo "$s" | jq .
          echo "$s" | jq -e '(.pending | not) and .status.result == "ok" and .values.UPDATE_WINDOW == "02-05"' >/dev/null
          grep -qx 'UPDATE_WINDOW=02-05' /opt/cdanet-cpe/.env || sudo grep -qx 'UPDATE_WINDOW=02-05' /opt/cdanet-cpe/.env
          # Caddy recreated with the new address list: self-signed HTTPS on 127.0.0.1
          for i in $(seq 1 20); do curl -kfsS https://127.0.0.1/api/health && break; sleep 3; done
          curl -kfsS https://127.0.0.1/api/health | grep -q '"ok":true'
          # invalid values are refused by the app and never reach the agent
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" -H 'Content-Type: application/json' -d '{"values":{"APP_LISTEN":":80\nJWT_SECRET=x"}}' http://localhost/api/admin/infra)" = 400

      - name: Diagnostics
        if: always()
        run: |
          docker ps -a
          for s in app caddy updater nominatim; do
            c=$(docker ps -aqf "label=com.docker.compose.project=$PROJECT" -f label=com.docker.compose.service=$s | head -n1)
            [ -n "$c" ] || continue
            echo "::group::$s logs"; docker logs --tail 150 "$c" 2>&1; echo "::endgroup::"
          done

  upgrade:
    # The path of a real server: a published release is running, then the installer
    # (or the updater) moves it to the new image. Checks migrations and data.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ADMIN_PW: E2e-Admin-Password-1
      PROJECT: cdanet-cpe-configurator
      FROM_VERSION: 1.0.7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image of this commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: cdanet-e2e:ci
          build-args: |
            VERSION=e2e
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Debian 12 "server" with Docker CLI
        run: |
          sudo mkdir -p /opt/cdanet-cpe /etc/cdanet-cpe /srv/cdanet-private /root/.docker
          docker run -d --name srv \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /opt/cdanet-cpe:/opt/cdanet-cpe -v /etc/cdanet-cpe:/etc/cdanet-cpe -v /srv/cdanet-private:/srv/cdanet-private \
            -v "$PWD:/src:ro" debian:12 sleep infinity
          docker exec srv bash -euc '
            apt-get update -qq && apt-get install -y -qq ca-certificates curl >/dev/null
            install -m0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
            echo "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" >/etc/apt/sources.list.d/docker.list
            apt-get update -qq && apt-get install -y -qq docker-ce-cli docker-compose-plugin >/dev/null'

      - name: Install the published release
        run: |
          docker exec -e CDANET_ADMIN_USER=admin -e CDANET_ADMIN_PASSWORD="$ADMIN_PW" -e CDANET_GEOCODER=public -e CDANET_MAP=off \
            -e CDANET_CHANNEL="$FROM_VERSION" srv /src/deploy/install-debian.sh
          curl -fsS http://localhost/api/health | tee /dev/stderr | grep -q "\"version\":\"$FROM_VERSION\""

      - name: Create data on the old version
        run: |
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PW\"}" http://localhost/api/auth/login | jq -r .token)
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"username":"tecnico-e2e","password":"Installer-Pass-123"}' http://localhost/api/admin/users >/dev/null

      - name: Upgrade to this commit
        run: |
          docker exec -e CDANET_IMAGE=cdanet-e2e -e CDANET_CHANNEL=ci -e CDANET_SKIP_PULL=1 -e CDANET_MAP=off srv /src/deploy/install-debian.sh
          curl -fsS http://localhost/api/health | tee /dev/stderr | grep -q "\"version\":\"$(jq -r .version server/package.json)\""
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PW\"}" http://localhost/api/auth/login | jq -r .token)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost/api/admin/users | jq -e 'map(.username) | index("tecnico-e2e") != null' >/dev/null
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost/api/admin/connectors | jq -e '.uisp.source == "none" and .geocoder.local == false' >/dev/null
          curl -fsS -H 'Content-Type: application/json' -d '{"username":"tecnico-e2e","password":"Installer-Pass-123"}' http://localhost/api/auth/login | jq -e '.token' >/dev/null

      - name: Diagnostics
        if: always()
        run: |
          docker ps -a
          c=$(docker ps -aqf "label=com.docker.compose.project=$PROJECT" -f label=com.docker.compose.service=app | head -n1)
          [ -z "$c" ] || docker logs --tail 150 "$c" 2>&1
