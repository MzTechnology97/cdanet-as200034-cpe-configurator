name: cdanet-cpe-configurator
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRETS_KEY_FILE: /run/secrets/cdanet_master_key
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - appdata:/app/server/data
      - ${FIRMWARE_HOST_PATH}:/opt/cdanet/firmware/WA-8.7.4.bin:ro
      - /etc/cdanet-cpe/secrets/master.key:/run/secrets/cdanet_master_key:ro
    expose: ["8787"]
    networks: [private]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [private]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  private:
    driver: bridge
volumes:
  appdata:
  caddy_data:
  caddy_config:
