# CDA Net CPE Configurator - production stack.
#   app      API + Admin/NOC web console (image built by CI from the repository)
#   caddy    reverse proxy, automatic HTTPS when APP_LISTEN is a hostname
#   updater  pulls new app images, backs up the DB, rolls back if unhealthy
#   nominatim (optional, COMPOSE_PROFILES=geocoder) local OpenStreetMap address search
#   maptiles  (one-shot, "sudo cdanet-cpe map update") Protomaps basemap for the console maps
name: cdanet-cpe-configurator

services:
  app:
    image: ${CDANET_IMAGE:-ghcr.io/mztechnology97/cdanet-cpe-server}:${CDANET_CHANNEL:-stable}
    restart: unless-stopped
    env_file: .env
    environment:
      # First boot only (installer passes it once; never stored in .env).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DB_PATH: /data/cdanet.sqlite
      SECRETS_KEY_FILE: /run/secrets/cdanet_master_key
      ANDROID_RELEASE_DIR: /opt/cdanet/releases
    init: false
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - appdata:/data
      - ${MASTER_KEY_HOST_PATH:-/etc/cdanet-cpe/secrets/master.key}:/run/secrets/cdanet_master_key:ro
      - ${ANDROID_RELEASE_HOST_PATH:-/srv/cdanet-private/releases}:/opt/cdanet/releases
    expose: ["8787"]
    networks: [private]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_LISTEN: ${APP_LISTEN:-:80}
      # self-signed HTTPS (Caddy local CA) on these addresses, space separated
      HTTPS_SITES: ${HTTPS_SITES:-https://localhost}
      HTTPS_DEFAULT_SNI: ${HTTPS_DEFAULT_SNI:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [private]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Local OpenStreetMap geocoder. First start downloads the OSM extract and imports it
  # (~20-60 min for Sicily, hours for all of Italy); meanwhile the app uses
  # GEOCODER_FALLBACK_URL. Data persist in the nominatim_data volume and are kept
  # up to date daily (Geofabrik / openstreetmap.fr). Never exposed outside the private network.
  nominatim:
    image: mediagis/nominatim:5.3
    profiles: [geocoder]
    restart: unless-stopped
    shm_size: ${NOMINATIM_SHM_SIZE:-1g}
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.openstreetmap.fr/extracts/europe/italy/sicilia-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-https://download.openstreetmap.fr/replication/europe/italy/sicilia/minute/}
      UPDATE_MODE: ${NOMINATIM_UPDATE_MODE:-continuous}
      IMPORT_STYLE: ${NOMINATIM_IMPORT_STYLE:-address}
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-}  # generated by the installer
      THREADS: ${NOMINATIM_THREADS:-2}
      GUNICORN_WORKERS: ${NOMINATIM_WORKERS:-2}
      # Sized for a small server (image defaults assume 32+ GB of RAM).
      POSTGRES_SHARED_BUFFERS: ${NOMINATIM_PG_SHARED_BUFFERS:-512MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${NOMINATIM_PG_MAINTENANCE_WORK_MEM:-1GB}
      POSTGRES_AUTOVACUUM_WORK_MEM: ${NOMINATIM_PG_AUTOVACUUM_WORK_MEM:-256MB}
      POSTGRES_WORK_MEM: ${NOMINATIM_PG_WORK_MEM:-32MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${NOMINATIM_PG_EFFECTIVE_CACHE_SIZE:-2GB}
    volumes:
      - nominatim_data:/var/lib/postgresql/16/main
    expose: ["8080"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8080/status?format=json' | grep -Eq '\"status\": ?0[,}]'"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 24h
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  updater:
    image: docker:27-cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/updater/update.sh"]
    environment:
      COMPOSE_PROJECT_NAME: cdanet-cpe-configurator
      DEPLOY_DIR: ${DEPLOY_DIR:-/opt/cdanet-cpe}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-300}
      UPDATE_WINDOW: ${UPDATE_WINDOW:-}
      AUTOUPDATE: ${AUTOUPDATE:-1}
      DOCKER_CONFIG: /docker-config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path as on the host so relative bind mounts resolve correctly.
      - ${DEPLOY_DIR:-/opt/cdanet-cpe}:${DEPLOY_DIR:-/opt/cdanet-cpe}:ro
      - ./updater:/updater:ro
      - updater_state:/state
      # Optional registry credentials (private GHCR package): docker login writes here.
      - ${REGISTRY_AUTH_DIR:-/root/.docker}:/docker-config:ro
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # One-shot: downloads/refreshes the Protomaps basemap (OpenStreetMap data) into the app data
  # volume; run by the installer, by "sudo cdanet-cpe map update" and by a monthly systemd timer.
  maptiles:
    image: debian:12-slim
    profiles: [maps]
    restart: "no"
    environment:
      MAP_BBOX: ${MAP_BBOX:-11.85,35.45,15.70,38.85}
      MAP_MAXZOOM: ${MAP_MAXZOOM:-15}
    volumes:
      - appdata:/data
      - ./maps/fetch-basemap.sh:/fetch-basemap.sh:ro
    entrypoint: ["/bin/sh", "/fetch-basemap.sh"]
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  appdata:
  caddy_data:
  caddy_config:
  updater_state:
  nominatim_data:
